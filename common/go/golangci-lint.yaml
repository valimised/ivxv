run:
  timeout: 5m

linters:
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - goconst
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - gosec
    - gosimple
    - govet
    - ineffassign
    - lll
    - nolintlint
    - revive
    - staticcheck # also checks for deprecated code
    - stylecheck
    - typecheck
    - unconvert
    - unused

linters-settings:
  goimports:
    local-prefixes: ivxv.ee
  lll:
    tab-width: 8
  nolintlint:
    allow-unused: false
    allow-leading-space: false
    require-specific: true

issues:
  # Escape all *_test.log and log_desc.go files from linter
  exclude-files:
    - '(.+)_test\.go'
    - '(.+)log_desc\.go'
  # Escape code generator from linter
  exclude-dirs:
    - 'log/cmd/gen'
